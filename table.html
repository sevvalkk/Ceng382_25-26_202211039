<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Class Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="afterLogin">

    <form class="classBox" id="classForm">
        <div class="mb-3">
            <div class="text4 ver1">Class Information</div>
        </div>
        <div class="mb-3" style="width:400px; text-align: center">
            <label for="className" class="text4 ver2">Class Name:</label>
            <input type="text" class="form-control" style="opacity:0.75; border-width: 5px;" id="className" required>
        </div>

        <div class="mb-3" style="width:400px; text-align: center">
            <label for="numPeople" class="text4 ver2">Number of People:</label>
            <input type="number" class="form-control" style="opacity:0.75; border-width: 5px;" id="numPeople" required>
        </div>

        <div class="mb-3" style="width:400px; text-align: center;">
            <label for="description" class="text4 ver2">Description:</label>
            <textarea class="form-control" style="opacity:0.75; border-width: 5px; max-height:150px;" id="description" required></textarea>
        </div>

        <button type="submit" class="updateBox" style="left:center">Update</button>
    </form>

    <form class="classBox" style="overflow-y: auto;">
        <h2 class="text4 ver1">Class List</h2>
        <table class="table table-striped" id="classTable">
            <thead class="table-dark">
                <tr>
                    <th>Class Name</th>
                    <th id="numPeopleHeader" title="Sort" style="cursor: pointer;">Number of People</th>
                    <th>Description</th>
                    <th>Delete</th> 
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </form>

    <script>
        let ascending = true; 

        document.getElementById("classForm").addEventListener("submit", function(event) {
            event.preventDefault(); 

            const className = document.getElementById("className").value;
            const numPeople = document.getElementById("numPeople").value;
            const description = document.getElementById("description").value;
            const tableBody = document.querySelector("#classTable tbody");

            // Create a new row with the class information
            const newRow = document.createElement("tr");
            newRow.innerHTML = `
                <td tabindex="0">${className}</td>
                <td tabindex="0">${numPeople}</td>
                <td tabindex="0">${description}</td>
                <td><span class="deleteBtn" onclick="deleteRow(this)">Delete</span></td> 
            `;

            tableBody.appendChild(newRow);

            document.getElementById("classForm").reset();
        });

        // Delete a row when the delete button is clicked
        function deleteRow(button) {
            const row = button.closest("tr"); 
            row.remove(); 
        }

        document.getElementById("numPeopleHeader").addEventListener("click", function() {
            const rows = Array.from(document.querySelectorAll("#classTable tbody tr"));
            
            // Sort the rows based on the "Number of People" column
            rows.sort((rowA, rowB) => {
                const numA = parseInt(rowA.children[1].textContent);
                const numB = parseInt(rowB.children[1].textContent);
                
                if (ascending) {
                    return numA - numB; 
                } else {
                    return numB - numA; 
                }
            });

            const tableBody = document.querySelector("#classTable tbody");
            tableBody.innerHTML = ""; 
            rows.forEach(row => tableBody.appendChild(row)); 

            ascending = !ascending;
        });
    </script>

</body>
</html>
